name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: oraculo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_TEST_URL: postgresql://test:synthetic-ci-only@localhost:5432/oraculo_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Build de produção
        run: npm run build
      - name: Testes de acesso com o build de produção
        run: npx playwright test
      - name: Guardar diagnóstico dos testes de acesso
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-tests-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  layout:
    name: Layout e capturas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LAYOUT_ARTIFACT_DIR: test-results/layout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Instalar Chromium e dependências do navegador
        run: npx playwright install --with-deps chromium
      - name: Verificar layout e comportamento em quatro larguras
        run: npm run test:layout
      - name: Guardar capturas e trace, inclusive em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-capturas-${{ github.run_id }}
          path: test-results/layout/
          if-no-files-found: warn
          retention-days: 7
